<div class="flex flex-col gap-4 text-xs">
  <!-- Algorithm Selector -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <label class="font-semibold block mb-1.5 flex items-center gap-1.5" style="color: var(--color-text-primary);">
      <span>Алгоритм пошуку:</span>
    </label>
    <select id="maze-algorithm-select" class="w-full border rounded-lg px-2.5 py-1.5 text-xs font-medium outline-none cursor-pointer" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
      <option value="wave-uni" selected>Лаб 3: Одно-направлений хвильовий (Лі)</option>
      <option value="wave-bi">Лаб 4: Двонаправлений хвильовий (Зустрічний)</option>
    </select>
  </div>

  <!-- Transition Operator -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <span class="font-semibold block mb-2" style="color: var(--color-text-primary);">Оператор переходу:</span>
    <div class="flex flex-col gap-1.5 text-[11px]" style="color: var(--color-text-secondary);">
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="maze-operator" value="orthogonal" checked class="accent-blue-500">
        <span>«Вверх-вниз-вправо-вліво» (4-напрямковий)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="maze-operator" value="diagonal" class="accent-blue-500">
        <span>«Перехід по діагоналях» (4 діагоналі)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="maze-operator" value="all" class="accent-blue-500">
        <span>Комбінація двох (8-напрямковий)</span>
      </label>
    </div>
  </div>

  <!-- Presets Selector -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <label class="font-semibold block mb-1.5 flex items-center gap-1.5" style="color: var(--color-text-primary);">
      <span>Лабіринти за замовчуванням (порядок 10–20):</span>
    </label>
    <select id="maze-preset-select" class="w-full border rounded-lg px-2.5 py-1.5 text-xs font-medium outline-none cursor-pointer" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
      <!-- Populated dynamically -->
    </select>
  </div>

  <!-- Grid Size & Order Controls -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <div class="flex items-center justify-between mb-2">
      <span class="font-semibold" style="color: var(--color-text-primary);">Порядок / Розмірність сітки:</span>
      <span id="maze-grid-dimensions-label" class="font-mono text-[11px] font-semibold" style="color: var(--color-accent-primary);">15 × 15</span>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="text-[11px] block mb-1 font-medium" style="color: var(--color-text-secondary);">Рядків (N):</label>
        <input id="maze-input-rows" type="number" min="5" max="30" value="15" class="w-full border rounded-lg px-2 py-1 text-xs font-mono outline-none" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
      </div>
      <div>
        <label class="text-[11px] block mb-1 font-medium" style="color: var(--color-text-secondary);">Стовпців (M):</label>
        <input id="maze-input-cols" type="number" min="5" max="30" value="15" class="w-full border rounded-lg px-2 py-1 text-xs font-mono outline-none" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
      </div>
    </div>

    <!-- Quick Size Buttons -->
    <div class="flex items-center gap-1.5 pt-1">
      <span class="text-[10px]" style="color: var(--color-text-muted);">Порядок:</span>
      <button id="maze-btn-order-10" class="px-2 py-0.5 rounded border text-[10px] font-medium hover:opacity-80" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">10×10</button>
      <button id="maze-btn-order-15" class="px-2 py-0.5 rounded border text-[10px] font-medium hover:opacity-80" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">15×15</button>
      <button id="maze-btn-order-20" class="px-2 py-0.5 rounded border text-[10px] font-medium hover:opacity-80" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">20×20</button>
    </div>
  </div>

  <!-- Start & Goal Selection -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <div class="flex items-center justify-between mb-2">
      <span class="font-semibold" style="color: var(--color-text-primary);">Точки Start та Goal</span>
      <button id="maze-btn-swap" title="Поміняти Start та Goal місцями" class="flex items-center gap-1 px-2 py-1 rounded border font-medium transition active:scale-95 text-[11px]" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-accent-primary);">
        <span>Поміняти</span>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div class="p-2 rounded-lg border" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted);">
        <span class="text-[11px] block font-medium text-emerald-400">● Start (S):</span>
        <span id="maze-start-coord" class="font-mono text-xs font-semibold" style="color: var(--color-text-primary);">(1, 1)</span>
      </div>

      <div class="p-2 rounded-lg border" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted);">
        <span class="text-[11px] block font-medium text-rose-400">● Goal (G):</span>
        <span id="maze-goal-coord" class="font-mono text-xs font-semibold" style="color: var(--color-text-primary);">(13, 13)</span>
      </div>
    </div>
  </div>

  <!-- Canvas Interaction Mode -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <span class="font-semibold block mb-2" style="color: var(--color-text-primary);">Режим взаємодії з полем:</span>
    <div class="flex flex-col gap-1.5 text-[11px]" style="color: var(--color-text-secondary);">
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="maze-mode" value="toggle-wall" checked class="accent-blue-500">
        <span>Малювання / Стирання стін (-1)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="maze-mode" value="set-start" class="accent-blue-500">
        <span>Клік для вибору Start (S)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="maze-mode" value="set-goal" class="accent-blue-500">
        <span>Клік для вибору Goal (G)</span>
      </label>
    </div>
  </div>

  <!-- Grid Actions (Tools) -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <span class="font-semibold block mb-2" style="color: var(--color-text-primary);">Генератор та редактор перешкод:</span>
    <div class="grid grid-cols-2 gap-2">
      <button id="maze-btn-random" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-90 active:scale-95 transition" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
        🎲 Випадкові стіни
      </button>
      <button id="maze-btn-clear" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-90 active:scale-95 transition text-rose-400" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted);">
        🗑 Очистити стіни
      </button>
      <button id="maze-btn-invert" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-90 active:scale-95 transition" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
        🔄 Інвертувати
      </button>
      <button id="maze-btn-fit" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-90 active:scale-95 transition" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-accent-primary);">
        🔍 Центрувати сітку
      </button>
    </div>
  </div>
</div>
