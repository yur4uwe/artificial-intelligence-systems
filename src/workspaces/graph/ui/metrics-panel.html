<div class="flex flex-col gap-4 text-xs">
  <!-- Status Card -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <div class="flex items-center justify-between mb-2">
      <span class="font-medium" style="color: var(--color-text-secondary);">Статус пошуку:</span>
      <span id="gmp-status-badge" class="px-2.5 py-0.5 rounded-full font-semibold text-[11px] border" style="background-color: var(--color-bg-elevated); border-color: var(--color-border-subtle); color: var(--color-text-secondary);">
        Очікування запуску
      </span>
    </div>
    
    <div class="rounded-lg p-2.5 border" style="background-color: var(--color-bg-surface); border-color: var(--color-border-subtle);">
      <span class="block mb-1 font-medium" style="color: var(--color-text-secondary);">Знайдений шлях:</span>
      <div id="gmp-path-display" class="font-mono text-xs break-words font-medium min-h-[1.5rem]" style="color: var(--color-node-path);">
        —
      </div>
    </div>
  </div>

  <!-- Metrics Grid -->
  <div class="grid grid-cols-2 gap-2.5">
    <div class="border rounded-xl p-2.5" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
      <span class="block text-[11px]" style="color: var(--color-text-secondary);">Довжина шляху:</span>
      <span id="gmp-path-length" class="text-lg font-bold font-mono" style="color: var(--color-text-primary);">0</span>
      <span class="text-[10px] ml-1" style="color: var(--color-text-muted);">ребер</span>
    </div>

    <div class="border rounded-xl p-2.5" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
      <span class="block text-[11px]" style="color: var(--color-text-secondary);">Розкрито вершин:</span>
      <span id="gmp-opened-nodes" class="text-lg font-bold font-mono text-emerald-500">0</span>
    </div>

    <div class="border rounded-xl p-2.5" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
      <span class="block text-[11px]" style="color: var(--color-text-secondary);">Кількість циклів:</span>
      <span id="gmp-cycles" class="text-lg font-bold font-mono text-amber-500">0</span>
    </div>

    <div class="border rounded-xl p-2.5" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
      <span class="block text-[11px]" style="color: var(--color-text-secondary);">Час виконання:</span>
      <span id="gmp-exec-time" class="text-lg font-bold font-mono" style="color: var(--color-accent-primary);">0.00</span>
      <span id="gmp-exec-unit" class="text-[10px] ml-1" style="color: var(--color-text-muted);">мс</span>
    </div>
  </div>

  <!-- Live Frontier Card (Queue / Stack) -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <div class="flex items-center justify-between mb-2">
      <span class="font-semibold flex items-center gap-1.5" style="color: var(--color-text-primary);">
        <span id="gmp-frontier-title">Фронтир (Черга)</span>
      </span>
      <span id="gmp-frontier-count" class="text-[11px]" style="color: var(--color-text-muted);">0 елементів</span>
    </div>
    <div id="gmp-frontier-chips" class="flex flex-wrap gap-1.5 p-2 rounded-lg border min-h-[2.5rem] max-h-24 overflow-y-auto items-center" style="background-color: var(--color-bg-surface); border-color: var(--color-border-subtle);">
      <span class="text-xs italic" style="color: var(--color-text-muted);">Колекція порожня</span>
    </div>
  </div>

  <!-- Step Trace Log -->
  <div class="border rounded-xl p-3 shadow-md flex flex-col h-64 overflow-hidden" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <div class="flex items-center justify-between mb-2 shrink-0">
      <span class="font-semibold" style="color: var(--color-text-primary);">Журнал кроків</span>
    </div>
    <div id="gmp-log-list" class="flex-1 min-h-0 overflow-y-auto font-mono text-[11px] flex flex-col gap-1 pr-1 overscroll-contain">
      <div class="italic placeholder-log py-1" style="color: var(--color-text-muted);">Журнал пошуку з'явиться після запуску...</div>
    </div>
  </div>
</div>
