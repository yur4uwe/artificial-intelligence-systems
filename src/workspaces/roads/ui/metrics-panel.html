<div class="flex flex-col gap-3 text-xs">
    <!-- Status Card -->
    <div
        class="border rounded-xl p-3 shadow-md"
        style="
            background-color: var(--color-bg-app);
            border-color: var(--color-border-subtle);
        "
    >
        <div class="flex items-center justify-between mb-2">
            <span class="font-medium" style="color: var(--color-text-secondary)"
                >Статус маршруту:</span
            >
            <span
                id="rmp-status-badge"
                class="px-2.5 py-0.5 rounded-full font-semibold text-[11px] border"
                style="
                    background-color: var(--color-bg-elevated);
                    border-color: var(--color-border-subtle);
                    color: var(--color-text-secondary);
                "
            >
                Очікування запуску
            </span>
        </div>

        <div
            class="rounded-lg p-2.5 border"
            style="
                background-color: var(--color-bg-surface);
                border-color: var(--color-border-subtle);
            "
        >
            <span
                class="block mb-1 font-medium"
                style="color: var(--color-text-secondary)"
                >Найкоротший маршрут:</span
            >
            <div
                id="rmp-path-display"
                class="font-mono text-xs break-words font-medium min-h-[1.5rem]"
                style="color: var(--color-node-path)"
            >
                —
            </div>
        </div>
    </div>

    <!-- Metrics Grid -->
    <div class="grid grid-cols-2 gap-2.5">
        <div
            class="border rounded-xl p-2.5"
            style="
                background-color: var(--color-bg-app);
                border-color: var(--color-border-subtle);
            "
        >
            <span class="block text-[11px]" style="color: var(--color-text-secondary)"
                >Загальна відстань:</span
            >
            <span
                id="rmp-total-dist"
                class="text-lg font-bold font-mono"
                style="color: var(--color-text-primary)"
                >0</span
            >
            <span class="text-[10px] ml-1" style="color: var(--color-text-muted)"
                >км</span
            >
        </div>

        <div
            class="border rounded-xl p-2.5"
            style="
                background-color: var(--color-bg-app);
                border-color: var(--color-border-subtle);
            "
        >
            <span class="block text-[11px]" style="color: var(--color-text-secondary)"
                >Розкрито W-міст:</span
            >
            <span
                id="rmp-settled-count"
                class="text-lg font-bold font-mono text-emerald-500"
                >0</span
            >
        </div>

        <div
            class="border rounded-xl p-2.5"
            style="
                background-color: var(--color-bg-app);
                border-color: var(--color-border-subtle);
            "
        >
            <span class="block text-[11px]" style="color: var(--color-text-secondary)"
                >Релаксацій доріг:</span
            >
            <span
                id="rmp-relax-count"
                class="text-lg font-bold font-mono text-amber-500"
                >0</span
            >
        </div>

        <div
            class="border rounded-xl p-2.5"
            style="
                background-color: var(--color-bg-app);
                border-color: var(--color-border-subtle);
            "
        >
            <span class="block text-[11px]" style="color: var(--color-text-secondary)"
                >Час розрахунку:</span
            >
            <span
                id="rmp-exec-time"
                class="text-lg font-bold font-mono"
                style="color: var(--color-accent-primary)"
                >0.00</span
            >
            <span
                id="rmp-exec-unit"
                class="text-[10px] ml-1"
                style="color: var(--color-text-muted)"
                >мс</span
            >
        </div>
    </div>

    <!-- Candidate Unexpanded List Card -->
    <div
        class="border rounded-xl p-3 shadow-md"
        style="
            background-color: var(--color-bg-app);
            border-color: var(--color-border-subtle);
        "
    >
        <div class="flex items-center justify-between mb-2">
            <span
                class="font-semibold"
                style="color: var(--color-text-primary)"
            >
                Список нерозкритих вершин
            </span>
            <span
                id="rmp-unexpanded-count"
                class="text-[11px]"
                style="color: var(--color-text-muted)"
                >0 міст</span
            >
        </div>
        <div
            id="rmp-unexpanded-chips"
            class="flex flex-wrap gap-1.5 p-2 rounded-lg border min-h-[2.5rem] max-h-28 overflow-y-auto items-center"
            style="
                background-color: var(--color-bg-surface);
                border-color: var(--color-border-subtle);
            "
        >
            <span class="text-xs italic" style="color: var(--color-text-muted)"
                >Список порожній</span
            >
        </div>
    </div>

    <!-- Step Trace Log -->
    <div
        class="border rounded-xl p-3 shadow-md flex flex-col h-64 overflow-hidden"
        style="
            background-color: var(--color-bg-app);
            border-color: var(--color-border-subtle);
        "
    >
        <div class="flex items-center justify-between mb-2 shrink-0">
            <span class="font-semibold" style="color: var(--color-text-primary)"
                >Журнал кроків пошуку</span
            >
        </div>
        <div
            id="rmp-log-list"
            class="flex-1 min-h-0 overflow-y-auto font-mono text-[11px] flex flex-col gap-1 pr-1 overscroll-contain"
        >
            <div
                class="italic placeholder-log py-1"
                style="color: var(--color-text-muted)"
            >
                Журнал кроків з'явиться після запуску пошуку...
            </div>
        </div>
    </div>
</div>
