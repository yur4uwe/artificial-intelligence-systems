<div class="flex flex-col gap-4 text-xs">
  <!-- Preset Selector -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <label class="font-semibold block mb-1.5 flex items-center gap-1.5" style="color: var(--color-text-primary);">
      <span>Вихідний граф (≥30 вершин):</span>
    </label>
    <select id="l1-preset-select" class="w-full border rounded-lg px-2.5 py-1.5 text-xs font-medium outline-none cursor-pointer" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
      <option value="tree">1. Дерево (32 вершини, 5 рівнів гілок)</option>
      <option value="undirected">2. Звичайний граф (32 вершини, цикли)</option>
      <option value="directed">3. Орієнтований граф (32 вершини, дуги)</option>
    </select>
  </div>

  <!-- Start & Goal Selection -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <div class="flex items-center justify-between mb-2">
      <span class="font-semibold" style="color: var(--color-text-primary);">Початкова та Цільова вершини</span>
      <button id="l1-btn-swap" title="Дзеркальна заміна Start <-> Goal" class="flex items-center gap-1 px-2 py-1 rounded border font-medium transition active:scale-95" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-accent-primary);">
        <span>Поміняти</span>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <span class="text-[11px] block mb-1 font-medium text-emerald-400">● Початкова (S):</span>
        <select id="l1-start-select" class="w-full border rounded-lg px-2.5 py-1.5 text-xs font-mono outline-none" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
          <!-- Populated dynamically -->
        </select>
      </div>

      <div>
        <span class="text-[11px] block mb-1 font-medium text-rose-400">● Цільова (G):</span>
        <select id="l1-goal-select" class="w-full border rounded-lg px-2.5 py-1.5 text-xs font-mono outline-none" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-primary);">
          <!-- Populated dynamically -->
        </select>
      </div>
    </div>
  </div>

  <!-- Traversal Order Strategy (Lab Requirement) -->
  <div class="border rounded-xl p-3 shadow-md" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
    <span class="font-semibold block mb-2" style="color: var(--color-text-primary);">Порядок обходу суміжних вершин:</span>
    <div class="flex flex-col gap-1.5 text-[11px]" style="color: var(--color-text-secondary);">
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="neighbor-order" value="ascending-id" checked class="accent-blue-500">
        <span>За зростанням ID (<code class="font-mono font-semibold" style="color: var(--color-accent-primary);">1 → 2 → 3...</code>)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="neighbor-order" value="descending-id" class="accent-blue-500">
        <span>За спаданням ID (<code class="font-mono font-semibold" style="color: var(--color-accent-primary);">...3 → 2 → 1</code>)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer p-1 rounded hover:opacity-80">
        <input type="radio" name="neighbor-order" value="clockwise" class="accent-blue-500">
        <span>За годинниковою стрілкою (Геометрично)</span>
      </label>
    </div>
  </div>
</div>
