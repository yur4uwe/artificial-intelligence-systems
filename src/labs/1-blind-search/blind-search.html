<div class="flex-1 flex overflow-hidden w-full h-full">
  <!-- Canvas Area & Floating Playback Bar -->
  <div class="flex-1 flex flex-col relative overflow-hidden" style="background-color: var(--color-bg-app);">
    <canvas id="l1-canvas" class="w-full h-full block touch-none cursor-crosshair"></canvas>

    <!-- Floating Bottom Playback Controller -->
    <div class="absolute bottom-4 left-4 right-4 max-w-2xl mx-auto z-20" id="l1-playback-container"></div>
  </div>

  <!-- Right Control & Metrics Sidebar -->
  <aside class="w-96 border-l flex flex-col h-full z-10 shrink-0" style="background-color: var(--color-bg-surface); border-color: var(--color-border-subtle);">
    <!-- Sidebar Header / Tabs -->
    <div class="flex border-b p-1 shrink-0 text-xs" style="background-color: var(--color-bg-elevated); border-color: var(--color-border-subtle);">
      <button id="tab-btn-params" class="flex-1 py-1.5 rounded-lg text-center transition font-semibold border" style="background-color: var(--color-bg-surface); color: var(--color-text-primary); border-color: var(--color-border-muted);">
        Параметри
      </button>
      <button id="tab-btn-metrics" class="flex-1 py-1.5 rounded-lg text-center transition font-medium border" style="background-color: transparent; color: var(--color-text-secondary); border-color: transparent;">
        Результати
      </button>
    </div>

    <!-- Sidebar Panels -->
    <div class="flex-1 overflow-y-auto p-3">
      <div id="l1-params-panel" class="flex flex-col gap-3"></div>
      <div id="l1-metrics-panel" class="hidden flex flex-col gap-3"></div>
    </div>
  </aside>
</div>
