<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIS Labs — Методи та Системи ШІ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white" style="background-color: var(--color-bg-app); color: var(--color-text-primary);">
  <!-- Top App Navigation Bar -->
  <header id="app-header" class="h-14 border-b backdrop-blur px-4 flex items-center justify-between shrink-0 z-30" style="background-color: var(--color-bg-header); border-color: var(--color-border-subtle);">
    <div class="flex items-center gap-3">
        <h1 class="text-sm font-semibold leading-tight" style="color: var(--color-text-primary);">Системи Штучного Інтелекту</h1>
    </div>

    <!-- Lab Switcher Navigation Tabs (Lazy Loaded) -->
    <nav class="flex items-center p-1 rounded-xl border" id="lab-tabs-nav" style="background-color: var(--color-bg-app); border-color: var(--color-border-subtle);">
      <!-- Dynamically populated from labs/registry.ts -->
    </nav>

    <!-- Header Actions (Theme, Info, Export) -->
    <div class="flex items-center gap-2" id="header-actions">
      <button id="btn-export-screenshot" title="Зберегти знімок графа (PNG)" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition flex items-center gap-1.5" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-secondary);">
        <span>Знімок</span>
      </button>
      <button id="btn-export-data" title="Експорт результатів у CSV" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition flex items-center gap-1.5" style="background-color: var(--color-bg-surface); border-color: var(--color-border-muted); color: var(--color-text-secondary);">
        <span>Експорт CSV</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport for Active Lab -->
  <main id="app-viewport" class="flex-1 flex overflow-hidden relative">
    <!-- Active Lab mounts here -->
    <div id="lab-container" class="w-full h-full flex"></div>
    
    <!-- Loading Overlay for Lazy Loading -->
    <div id="loading-overlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center">
      <div class="flex flex-col items-center gap-3">
        <div class="w-8 h-8 border-3 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-slate-300 font-medium">Завантаження модуля лабораторної...</p>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
